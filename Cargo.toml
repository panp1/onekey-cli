[package]
name = "onekey-cli"
version = "0.7.1"
edition = "2024"
license = "Apache-2.0"
description = "Lightweight command-line client for a OneKey secrets server"
repository = "https://github.com/panp1/onekey-cli"

[lib]
name = "onekey_cli"
path = "src/lib.rs"

[[bin]]
name = "onekey"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util"] }
clap = { version = "4", features = ["derive"] }
anstream = "1"
anstyle = "1"
inquire = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
toml = "0.9"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
  "multipart",
] }
# Local Model Context Protocol server (stdio only).
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
# CLI session and offline cache encryption.
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
getrandom = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
regex = "1"
ulid = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process", "fs"] }

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[profile.release]
opt-level = "z"
strip = "symbols"
lto = "thin"
codegen-units = 1
